[pytest]
testpaths = tests
# Offline by default: a bare `pytest` must not start real downloads or
# 30-minute builds. Opt in explicitly with -m network / -m slow (a -m given
# on the CLI overrides addopts).
addopts = -m "not network and not slow"
markers =
    network: tests that require network access (deselected by default; opt in with '-m network')
    slow: slow tests (deselected by default; opt in with '-m slow')
