services:
  ubuntu2004:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ubuntu2004
    container_name: pwnlibc-test-2004

  ubuntu2204:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ubuntu2204
    container_name: pwnlibc-test-2204

  ubuntu2404:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ubuntu2404
    container_name: pwnlibc-test-2404

  ubuntu2604:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ubuntu2604
    container_name: pwnlibc-test-2604

  # Full E2E: run network+slow tests (qemu, GDB, real downloads)
  e2e-2404:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ubuntu2404
    container_name: pwnlibc-e2e-2404
    command: >
      python3 -m pytest tests/ -v --tb=short
      -m "network or slow"
      -k "e2e_qemu or gdb_debug or PatchAndRun"
